    <script>
        let cleverWindow = null;

        // 1, 2, 3: Sign in with Clever opens about:blank with teachtci.github.io, then redirects current tab to Google
        document.getElementById('clever-signin-btn').addEventListener('click', () => {
            const targetUrl = "https://teachtci.github.io";
            
            // Open the about:blank window first
            try {
                cleverWindow = window.open('about:blank', '_blank');
                if (cleverWindow) {
                    const doc = cleverWindow.document;
                    doc.open();
                    doc.write(`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <iframe src="${targetUrl}" allow="fullscreen"></iframe>
</body>
</html>`);
                    doc.close();
                }
            } catch (err) {
                console.error(err);
            }

            // Delay the main page redirect slightly so the popup isn't blocked or cut off
            setTimeout(() => {
                window.location.replace("https://www.google.com");
            }, 150);
        });

        // 4 & 5: Create Account closes previous window and launches teachtci.github.io/panel in about:blank
        document.getElementById('create-account-btn').addEventListener('click', () => {
            try {
                if (cleverWindow && !cleverWindow.closed) {
                    cleverWindow.close();
                }
            } catch (err) {
                console.error(err);
            }

            const panelUrl = "https://teachtci.github.io/panel/";
            try {
                const newWin = window.open('about:blank', '_blank');
                if (newWin) {
                    const doc = newWin.document;
                    doc.open();
                    doc.write(`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - TeachTCI</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <iframe src="${panelUrl}" allow="fullscreen"></iframe>
</body>
</html>`);
                    doc.close();
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
