    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        function showToast(title, description) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-white text-black px-4 py-3 rounded-md shadow-lg border border-gray-200 transition-all duration-300 transform translate-y-2 opacity-0 flex flex-col";
            toast.innerHTML = `<span class="font-bold text-sm">${title}</span><span class="text-xs text-gray-600">${description}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function runClock() {
            const timeMainEl = document.getElementById('time-main');
            const timeAmpmEl = document.getElementById('am-pm-trigger');
            const timeSecondsEl = document.getElementById('time-seconds');
            const dateDisplayEl = document.getElementById('date-display');
            
            const opt12hr = document.getElementById('opt-12hr');
            const optAmpm = document.getElementById('opt-ampm');
            const optSeconds = document.getElementById('opt-seconds');
            const optDate = document.getElementById('opt-date');
            const optWeek = document.getElementById('opt-week');
            const optTabSeconds = document.getElementById('opt-tabseconds');
            const optTimezone = document.getElementById('opt-timezone');

            function update() {
                const now = new Date();
                const tz = optTimezone ? optTimezone.value : 'America/Los_Angeles';

                let targetDate = now;
                if (tz !== 'local') {
                    try {
                        const tzString = now.toLocaleString('en-US', { timeZone: tz });
                        targetDate = new Date(tzString);
                    } catch(e) {
                        targetDate = now;
                    }
                }

                let h = targetDate.getHours();
                let m = targetDate.getMinutes();
                let s = targetDate.getSeconds();
                let period = "";

                const use12 = opt12hr ? opt12hr.checked : true;

                if (use12) {
                    period = h >= 12 ? 'PM' : 'AM';
                    h = h % 12;
                    h = h ? h : 12;
                }

                const hh = String(h).padStart(2, '0');
                const mm = String(m).padStart(2, '0');
                const ss = String(s).padStart(2, '0');

                if (timeMainEl) timeMainEl.textContent = `${hh}:${mm}`;
                if (timeAmpmEl) {
                    timeAmpmEl.style.display = (use12 && optAmpm && optAmpm.checked) ? 'inline-block' : 'none';
                    timeAmpmEl.textContent = period;
                }
                if (timeSecondsEl) {
                    timeSecondsEl.style.display = (optSeconds && optSeconds.checked) ? 'block' : 'none';
                    timeSecondsEl.textContent = ss;
                }

                if (dateDisplayEl) {
                    const options = { weekday: 'long', month: 'long', day: 'numeric' };
                    dateDisplayEl.textContent = targetDate.toLocaleDateString('en-US', options);
                }

                if (optTabSeconds && optTabSeconds.checked) {
                    document.title = `${hh}:${mm}:${ss} - Home - TeachTCI`;
                } else {
                    document.title = "Home - TeachTCI";
                }
            }

            update();
            setInterval(update, 1000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runClock);
        } else {
            runClock();
        }

            const fonts = [
                { name: 'Lexend', val: "'Lexend', sans-serif" },
                { name: 'Standard Sans', val: "ui-sans-serif, system-ui, sans-serif" },
                { name: 'Monospace', val: "monospace" },
                { name: 'Serif', val: "Georgia, serif" }
            ];
            le
