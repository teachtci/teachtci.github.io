<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - TeachTCI</title>
    <link rel="icon" type="image/png" href="https://favicons.statusgator.com/UNZSryX8tg2s2hlE.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--custom-bg, #09090b);
            color: var(--custom-text, #ffffff);
            font-family: var(--custom-font, 'Lexend', sans-serif);
        }
        .clock-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between select-none overflow-hidden transition-colors duration-300">

    <!-- Main Display Area -->
    <div class="flex-grow flex flex-col items-center justify-center relative p-4">
        
        <!-- Custom Local Clock View -->
        <div id="clock-view" class="flex flex-col items-center transition-transform duration-300 bg-white/[0.03] border border-white/[0.08] backdrop-blur-xl px-12 py-9 rounded-3xl shadow-2xl">
            <div class="flex items-baseline space-x-4">
                <span id="time-main" class="text-7xl md:text-9xl font-extrabold tracking-tight clock-glow">12:00</span>
                <div class="flex flex-col items-start justify-center h-full pb-2">
                    <span id="am-pm-trigger" class="text-xl md:text-3xl font-bold cursor-pointer hover:text-blue-400 transition" title="Click AM or PM to open Embedder">PM</span>
                    <span id="time-seconds" class="text-lg md:text-2xl font-medium opacity-60">00</span>
                </div>
            </div>
            <!-- Clickable Date Display -->
            <div id="date-display" class="mt-4 text-lg md:text-xl font-semibold tracking-widest uppercase opacity-75 cursor-pointer hover:text-blue-400 transition" title="Click to open Calendar">Loading Date...</div>
            <button id="toggle-stopwatch-mode" class="mt-4 text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-md transition text-zinc-300 cursor-pointer">Switch to Stopwatch</button>
        </div>

        <!-- Stopwatch View (Hidden by default) -->
        <div id="stopwatch-view" class="hidden flex-col items-center transition-transform duration-300 bg-white/[0.03] border border-white/[0.08] backdrop-blur-xl px-12 py-9 rounded-3xl shadow-2xl">
            <div class="flex items-baseline space-x-4">
                <span id="sw-main" class="text-7xl md:text-9xl font-extrabold tracking-tight clock-glow">00:00</span>
                <span id="sw-ms" class="text-lg md:text-2xl font-medium opacity-60">.00</span>
            </div>
            <div class="mt-6 flex gap-3">
                <button id="sw-start" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm transition cursor-pointer">Start</button>
                <button id="sw-reset" class="bg-zinc-700 hover:bg-zinc-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition cursor-pointer">Reset</button>
            </div>
            <button id="toggle-clock-mode" class="mt-4 text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-md transition text-zinc-300 cursor-pointer">Back to Clock</button>
        </div>

        <!-- Embedder View (Hidden by default) -->
        <div id="embedder-view" class="hidden flex-grow p-6 rounded-2xl overflow-auto max-w-2xl mx-auto mt-10 w-full z-10 bg-black/80 backdrop-blur-md border border-white/10 shadow-2xl text-white">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-3xl font-extrabold tracking-tight">embedder</h1>
                <button id="back-to-clock" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition font-bold cursor-pointer">Back to Dashboard</button>
            </div>
            <div class="mt-6">
                <input id="url-target" type="url" placeholder="Enter URL here and press Enter..." class="flex h-10 w-full rounded-md border border-input bg-white px-3 py-2 text-sm text-black ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
                
                <div class="flex py-2 mt-2">
                    <button id="create-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-zinc-700 text-white hover:bg-zinc-600 h-10 px-4 py-2 mr-2 transition cursor-pointer">Create Page</button>
                    <button id="clear-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-zinc-800 text-white hover:bg-zinc-700 h-10 px-4 py-2 transition cursor-pointer">Clear Input</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Floating Control Panel -->
    <div class="absolute right-5 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-50 bg-black/40 backdrop-blur-md p-2 rounded-xl border border-white/10 shadow-lg">
        <button id="btn-font" title="Cycle Font Family" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white font-bold text-sm cursor-pointer">
            Aa
        </button>
        <button id="btn-notes" title="Quick Notes" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg>
        </button>
        <button id="btn-heart" title="Favorite" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white cursor-pointer">
            <svg id="heart-icon" class="w-5 h-5 transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
        </button>
        <button id="btn-fullscreen" title="Toggle Fullscreen" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg>
        </button>
        <button id="btn-maximize" title="Compact / Expand View" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M15 15v4.5m0-4.5h4.5m0 4.5l-5.25-5.25"/></svg>
        </button>
        <button id="btn-themes" title="Customize Themes" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        </button>
        <button id="btn-settings" title="Clock Options" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
    </div>

    <!-- Calendar Modal -->
    <div id="calendar-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-2xl w-80 shadow-2xl flex flex-col gap-4 text-white">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 id="cal-month-year" class="font-bold text-lg">Month Year</h3>
                <button id="close-calendar-modal" class="text-zinc-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            </div>
            <div class="flex justify-between items-center my-1">
                <button id="cal-prev" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded text-xs font-bold transition cursor-pointer">&larr; Prev</button>
                <button id="cal-today" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded text-xs font-bold transition cursor-pointer">Today</button>
                <button id="cal-next" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded text-xs font-bold transition cursor-pointer">Next &rarr;</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-zinc-400 mb-1">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div id="cal-grid" class="grid grid-cols-7 gap-1 text-center text-sm">
                <!-- Days injected via JS -->
            </div>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notes-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-2xl w-80 shadow-2xl flex flex-col gap-4 text-white">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-lg">Quick Notes</h3>
                <button id="close-notes-modal" class="text-zinc-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            </div>
            <textarea id="quick-notes-area" placeholder="Jot down notes or homework reminders here..." class="w-full h-40 bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </div>
    </div>

    <!-- Themes Modal -->
    <div id="themes-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-2xl w-80 shadow-2xl flex flex-col gap-4 text-white max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-lg">Theme Customizer</h3>
                <button id="close-themes-modal" class="text-zinc-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            </div>
            <div class="flex flex-col gap-4 text-sm">
                <div>
                    <label class="font-semibold text-zinc-400 block mb-2">Preset Themes</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#09090b" data-text="#ffffff">Clean Dark</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#000000" data-text="#00ffcc">Matrix Green</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#f4f4f5" data-text="#18181b">Light Mode</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#0f172a" data-text="#38bdf8">Midnight Blue</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#181825" data-text="#cba6f7">Purple Dream</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#280d0f" data-text="#fca5a5">Sunset Red</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#1c1917" data-text="#fde047">Solarized Gold</button>
                        <button class="preset-btn bg-zinc-800 hover:bg-zinc-700 py-1.5 px-3 rounded text-xs border border-zinc-700 transition cursor-pointer" data-bg="#064e3b" data-text="#6ee7b7">Emerald Forest</button>
                    </div>
                </div>
                <hr class="border-zinc-800">
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-zinc-400">Custom Colors</label>
                    <div class="flex justify-between items-center">
                        <span>Background Color:</span>
                        <input type="color" id="picker-bg" value="#09090b" class="w-10 h-8 rounded bg-transparent cursor-pointer">
                    </div>
                    <div class="flex justify-between items-center">
                        <span>Text Color:</span>
                        <input type="color" id="picker-text" value="#ffffff" class="w-10 h-8 rounded bg-transparent cursor-pointer">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Clock Options Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-2xl w-80 shadow-2xl flex flex-col gap-4 text-white">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-lg">Clock Options</h3>
                <button id="close-settings-modal" class="text-zinc-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
            </div>
            <div class="flex flex-col gap-3 text-sm">
                <div class="flex flex-col gap-1">
                    <label class="font-semibold text-zinc-400">Time Zone</label>
                    <select id="opt-timezone" class="bg-zinc-800 border border-zinc-700 rounded p-2 text-white cursor-pointer">
                        <option value="America/Los_Angeles">Pacific Time (PT)</option>
                        <option value="America/New_York">Eastern Time (ET)</option>
                        <option value="UTC">UTC</option>
                        <option value="local">Device Local Time</option>
                    </select>
                </div>
                <label class="flex items-center gap-2 cursor-pointer mt-1"><input type="checkbox" id="opt-12hr" checked class="rounded bg-zinc-800 border-zinc-700"> 12-Hour Format</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-ampm" checked class="rounded bg-zinc-800 border-zinc-700"> Show AM/PM</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-seconds" checked class="rounded bg-zinc-800 border-zinc-700"> Show Seconds</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-date" checked class="rounded bg-zinc-800 border-zinc-700"> Show Date</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-week" checked class="rounded bg-zinc-800 border-zinc-700"> Show Week / Day</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-tabseconds" class="rounded bg-zinc-800 border-zinc-700"> Tab Title Seconds</label>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        function showToast(title, description) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = "bg-white text-black px-4 py-3 rounded-md shadow-lg border border-gray-200 transition-all duration-300 transform translate-y-2 opacity-0 flex flex-col";
            toast.innerHTML = `<span class="font-bold text-sm">${title}</span><span class="text-xs text-gray-600">${description}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function runClock() {
            const timeMainEl = document.getElementById('time-main');
            const timeAmpmEl = document.getElementById('am-pm-trigger');
            const timeSecondsEl = document.getElementById('time-seconds');
            const dateDisplayEl = document.getElementById('date-display');
            
            const opt12hr = document.getElementById('opt-12hr');
            const optAmpm = document.getElementById('opt-ampm');
            const optSeconds = document.getElementById('opt-seconds');
            const optDate = document.getElementById('opt-date');
            const optWeek = document.getElementById('opt-week');
            const optTabSeconds = document.getElementById('opt-tabseconds');
            const optTimezone = document.getElementById('opt-timezone');

            function update() {
                const now = new Date();
                const tz = optTimezone ? optTimezone.value : 'America/Los_Angeles';

                let targetDate = now;
                if (tz !== 'local') {
                    try {
                        const tzString = now.toLocaleString('en-US', { timeZone: tz });
                        targetDate = new Date(tzString);
                    } catch(e) {
                        targetDate = now;
                    }
                }

                let h = targetDate.getHours();
                let m = targetDate.getMinutes();
                let s = targetDate.getSeconds();
                let period = "";

                const use12 = opt12hr ? opt12hr.checked : true;

                if (use12) {
                    period = h >= 12 ? 'PM' : 'AM';
                    h = h % 12;
                    h = h ? h : 12;
                }

                const hh = String(h).padStart(2, '0');
                const mm = String(m).padStart(2, '0');
                const ss = String(s).padStart(2, '0');

                if (timeMainEl) timeMainEl.textContent = `${hh}:${mm}`;
                if (timeAmpmEl) {
                    timeAmpmEl.style.display = (use12 && optAmpm && optAmpm.checked) ? 'inline-block' : 'none';
                    timeAmpmEl.textContent = period;
                }
                if (timeSecondsEl) {
                    timeSecondsEl.style.display = (optSeconds && optSeconds.checked) ? 'block' : 'none';
                    timeSecondsEl.textContent = ss;
                }

                if (dateDisplayEl) {
                    try {
                        const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
                        dateDisplayEl.textContent = targetDate.toLocaleDateString('en-US', options);
                    } catch(err) {
                        dateDisplayEl.textContent = targetDate.toDateString();
                    }
                }

                if (optTabSeconds && optTabSeconds.checked) {
                    document.title = `${hh}:${mm}:${ss} - Home - TeachTCI`;
                } else {
                    document.title = "Home - TeachTCI";
                }
            }

            update();
            setInterval(update, 1000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runClock);
        } else {
            runClock();
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Interactive Calendar Modal Logic
            let calYear = new Date().getFullYear();
            let calMonth = new Date().getMonth();

            const calendarModal = document.getElementById('calendar-modal');
            const dateDisplayEl = document.getElementById('date-display');
            const closeCalendar = document.getElementById('close-calendar-modal');
            const calMonthYear = document.getElementById('cal-month-year');
            const calGrid = document.getElementById('cal-grid');
            const calPrev = document.getElementById('cal-prev');
            const calNext = document.getElementById('cal-next');
            const calToday = document.getElementById('cal-today');

            function renderCalendar(year, month) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();

                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                calMonthYear.textContent = `${monthNames[month]} ${year}`;

                calGrid.innerHTML = "";

                // Blank spaces for previous month offset
                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    calGrid.appendChild(emptyCell);
                }

                // Days of the month
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayCell = document.createElement('div');
                    dayCell.textContent = day;
                    dayCell.className = "py-1.5 rounded-lg text-sm transition font-medium flex items-center justify-center";

                    const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                    if (isToday) {
                        dayCell.classList.add('bg-blue-600', 'text-white', 'font-bold');
                    } else {
                        dayCell.classList.add('hover:bg-zinc-800', 'cursor-pointer');
                    }
                    calGrid.appendChild(dayCell);
                }
            }

            if (dateDisplayEl && calendarModal) {
                dateDisplayEl.addEventListener('click', () => {
                    const now = new Date();
                    calYear = now.getFullYear();
                    calMonth = now.getMonth();
                    renderCalendar(calYear, calMonth);
                    calendarModal.classList.replace('hidden', 'flex');
                });
            }

            if (closeCalendar && calendarModal) {
                closeCalendar.addEventListener('click', () => {
                    calendarModal.classList.replace('flex', 'hidden');
                });
            }

            if (calPrev) {
                calPrev.addEventListener('click', () => {
                    calMonth--;
                    if (calMonth < 0) {
                        calMonth = 11;
                        calYear--;
                    }
                    renderCalendar(calYear, calMonth);
                });
            }

            if (calNext) {
                calNext.addEventListener('click', () => {
                    calMonth++;
                    if (calMonth > 11) {
                        calMonth = 0;
                        calYear++;
                    }
                    renderCalendar(calYear, calMonth);
                });
            }

            if (calToday) {
                calToday.addEventListener('click', () => {
                    const now = new Date();
                    calYear = now.getFullYear();
                    calMonth = now.getMonth();
                    renderCalendar(calYear, calMonth);
                });
            }

            // Font Cycling Button Logic
            const fonts = [
                { name: 'Lexend', val: "'Lexend', sans-serif" },
                { name: 'Standard Sans', val: "ui-sans-serif, system-ui, sans-serif" },
                { name: 'Monospace', val: "monospace" },
                { name: 'Serif', val: "Georgia, serif" }
            ];
            let fontIndex = 0;
            const btnFont = document.getElementById('btn-font');
            if (btnFont) {
                btnFont.addEventListener('click', () => {
                    fontIndex = (fontIndex + 1) % fonts.length;
                    const selected = fonts[fontIndex];
                    document.documentElement.style.setProperty('--custom-font', selected.val);
                    showToast("Font Changed", `Switched to ${selected.name}`);
                });
            }

            // Stopwatch Logic
            let swInterval = null;
            let swSeconds = 0;
            let swRunning = false;

            const clockView = document.getElementById('clock-view');
            const stopwatchView = document.getElementById('stopwatch-view');
            const swMain = document.getElementById('sw-main');
            const swMs = document.getElementById('sw-ms');
            const swStart = document.getElementById('sw-start');
            const swReset = document.getElementById('sw-reset');

            const toggleSwBtn = document.getElementById('toggle-stopwatch-mode');
            const toggleClockBtn = document.getElementById('toggle-clock-mode');

            if (toggleSwBtn) {
                toggleSwBtn.addEventListener('click', () => {
                    clockView.classList.add('hidden');
                    stopwatchView.classList.remove('hidden');
                    stopwatchView.classList.add('flex');
                });
            }

            if (toggleClockBtn) {
                toggleClockBtn.addEventListener('click', () => {
                    stopwatchView.classList.remove('flex');
                    stopwatchView.classList.add('hidden');
                    clockView.classList.remove('hidden');
                });
            }

            if (swStart) {
                swStart.addEventListener('click', () => {
                    if (!swRunning) {
                        swRunning = true;
                        swStart.textContent = "Pause";
                        swStart.classList.replace('bg-blue-600', 'bg-amber-600');
                        swStart.classList.replace('hover:bg-blue-500', 'hover:bg-amber-500');
                        const startTime = Date.now() - (swSeconds * 1000);
                        swInterval = setInterval(() => {
                            const elapsed = Date.now() - startTime;
                            swSeconds = elapsed / 1000;
                            const mins = Math.floor(swSeconds / 60);
                            const secs = Math.floor(swSeconds % 60);
                            const millis = Math.floor((swSeconds % 1) * 100);
                            if (swMain) swMain.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                            if (swMs) swMs.textContent = `.${String(millis).padStart(2, '0')}`;
                        }, 50);
                    } else {
                        swRunning = false;
                        swStart.textContent = "Start";
                        swStart.classList.replace('bg-amber-600', 'bg-blue-600');
                        swStart.classList.replace('hover:bg-amber-500', 'hover:bg-blue-500');
                        clearInterval(swInterval);
                    }
                });
            }

            if (swReset) {
                swReset.addEventListener('click', () => {
                    swRunning = false;
                    clearInterval(swInterval);
                    swSeconds = 0;
                    if (swMain) swMain.textContent = "00:00";
                    if (swMs) swMs.textContent = ".00";
                    if (swStart) {
                        swStart.textContent = "Start";
                        swStart.classList.replace('bg-amber-600', 'bg-blue-600');
                    }
                });
            }

            // Quick Notes Auto-save Logic
            const notesModal = document.getElementById('notes-modal');
            const quickNotesArea = document.getElementById('quick-notes-area');
            
            if (quickNotesArea && localStorage.getItem('dashboard_quick_notes')) {
                quickNotesArea.value = localStorage.getItem('dashboard_quick_notes');
            }
            if (quickNotesArea) {
                quickNotesArea.addEventListener('input', () => {
                    localStorage.setItem('dashboard_quick_notes', quickNotesArea.value);
                });
            }

            const btnNotes = document.getElementById('btn-notes');
            const closeNotes = document.getElementById('close-notes-modal');
            if (btnNotes && notesModal) {
                btnNotes.addEventListener('click', () => notesModal.classList.replace('hidden', 'flex'));
            }
            if (closeNotes && notesModal) {
                closeNotes.addEventListener('click', () => notesModal.classList.replace('flex', 'hidden'));
            }

            const timeAmpmEl = document.getElementById('am-pm-trigger');
            if (timeAmpmEl) {
                timeAmpmEl.addEventListener('click', () => {
                    clockView.classList.add('hidden');
                    stopwatchView.classList.remove('flex');
                    stopwatchView.classList.add('hidden');
                    document.getElementById('embedder-view').classList.remove('hidden');
                });
            }

            const backToClockBtn = document.getElementById('back-to-clock');
            if (backToClockBtn) {
                backToClockBtn.addEventListener('click', () => {
                    document.getElementById('embedder-view').classList.add('hidden');
                    clockView.classList.remove('hidden');
                });
            }

            let isHeartRed = false;
            const btnHeart = document.getElementById('btn-heart');
            if (btnHeart) {
                btnHeart.addEventListener('click', () => {
                    isHeartRed = !isHeartRed;
                    const icon = document.getElementById('heart-icon');
                    if (isHeartRed) {
                        icon.setAttribute('fill', 'currentColor');
                        icon.classList.add('text-red-500');
                        showToast("Favorited", "Added to favorites!");
                    } else {
                        icon.setAttribute('fill', 'none');
                        icon.classList.remove('text-red-500');
                        showToast("Removed", "Removed from favorites.");
                    }
                });
            }

            const btnFullscreen = document.getElementById('btn-fullscreen');
            if (btnFullscreen) {
                btnFullscreen.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => alert(err.message));
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                    }
                });
            }

            let isCompact = false;
            const btnMaximize = document.getElementById('btn-maximize');
            const timeMainEl = document.getElementById('time-main');
            if (btnMaximize && timeMainEl) {
                btnMaximize.addEventListener('click', () => {
                    isCompact = !isCompact;
                    if (isCompact) {
                        timeMainEl.classList.replace('text-7xl', 'text-4xl');
                        timeMainEl.classList.replace('md:text-9xl', 'md:text-6xl');
                        showToast("Minimized", "Compact view enabled.");
                    } else {
                        timeMainEl.classList.replace('text-4xl', 'text-7xl');
                        timeMainEl.classList.replace('md:text-6xl', 'md:text-9xl');
                        showToast("Maximize", "Normal view restored.");
                    }
                });
            }

            const themesModal = document.getElementById('themes-modal');
            const settingsModal = document.getElementById('settings-modal');

            const btnThemes = document.getElementById('btn-themes');
            if (btnThemes && themesModal) {
                btnThemes.addEventListener('click', () => themesModal.classList.replace('hidden', 'flex'));
            }
            const closeThemes = document.getElementById('close-themes-modal');
            if (closeThemes && themesModal) {
                closeThemes.addEventListener('click', () => themesModal.classList.replace('flex', 'hidden'));
            }

            const btnSettings = document.getElementById('btn-settings');
            if (btnSettings && settingsModal) {
                btnSettings.addEventListener('click', () => settingsModal.classList.replace('hidden', 'flex'));
            }
            const closeSettings = document.getElementById('close-settings-modal');
            if (closeSettings && settingsModal) {
                closeSettings.addEventListener('click', () => settingsModal.classList.replace('flex', 'hidden'));
            }

            const pickerBg = document.getElementById('picker-bg');
            const pickerText = document.getElementById('picker-text');

            function applyTheme(bg, text) {
                document.documentElement.style.setProperty('--custom-bg', bg);
                document.documentElement.style.setProperty('--custom-text', text);
                if (pickerBg) pickerBg.value = bg;
                if (pickerText) pickerText.value = text;
            }

            if (pickerBg) pickerBg.addEventListener('input', (e) => document.documentElement.style.setProperty('--custom-bg', e.target.value));
            if (pickerText) pickerText.addEventListener('input', (e) => document.documentElement.style.setProperty('--custom-text', e.target.value));

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyTheme(btn.getAttribute('data-bg'), btn.getAttribute('data-text'));
                });
            });

            function triggerEmbedder() {
                let urlInput = document.getElementById("url-target");
                if (!urlInput) return;
                let url = urlInput.value.trim();
                if (!url) { showToast("Error", "URL cannot be empty."); return; }
                showToast("Page opened!", "The page has been opened in a new about:blank tab.");
                if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://" + url;
                
                const win = window.open('about:blank');
                if (win) {
                    win.document.body.style.margin = "0";
                    win.document.body.style.height = "100vh";
                    let frm = win.document.createElement("iframe");
                    frm.style.border = "none"; frm.style.width = "100%"; frm.style.height = "100%";
                    frm.referrerPolicy = "no-referrer"; frm.allow = "fullscreen"; frm.src = url;
                    win.document.body.appendChild(frm);
                }
            }

            const createBtn = document.getElementById('create-btn');
            if (createBtn) {
                createBtn.addEventListener('click', triggerEmbedder);
            }

            const urlTarget = document.getElementById('url-target');
            if (urlTarget) {
                urlTarget.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        triggerEmbedder();
                    }
                });
            }

            const clearBtn = document.getElementById('clear-btn');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    const input = document.getElementById("url-target");
                    if (!input || !input.value) { showToast("Error", "Input is already empty."); return; }
                    input.value = "";
                    showToast("Input cleared", "The input has been cleared.");
                });
            }
        });
    </script>
</body>
</html>
