<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - TT</title>
    <link rel="icon" type="image/png" href="https://favicons.statusgator.com/UNZSryX8tg2s2hlE.png">
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom background theme styles */
        body.theme-carbon {
            background-color: #121212;
            background-image: radial-gradient(circle, #222 10%, transparent 10%);
            background-size: 20px 20px;
        }
        body.theme-dark {
            background-color: #09090b;
            background-image: none;
        }
        body.theme-light {
            background-color: #f4f4f5;
            color: #18181b;
            background-image: none;
        }
        body.theme-blue {
            background-color: #0f172a;
            background-image: linear-gradient(to bottom right, #1e293b, #0f172a);
        }
    </style>
</head>
<body class="theme-carbon text-white h-screen flex flex-col justify-between select-none overflow-hidden transition-colors duration-300">

    <!-- Top / Main Display Area -->
    <div id="main-display-container" class="flex-grow flex flex-col items-center justify-center relative p-4">
        
        <!-- Clock & Date Display Box (Time.is style) -->
        <div id="clock-view" class="flex flex-col items-center cursor-pointer transition-transform duration-200">
            <div class="flex items-baseline space-x-3">
                <span id="time-main" class="text-7xl md:text-9xl font-light tracking-wider font-mono">00:00</span>
                <div class="flex flex-col items-start font-mono">
                    <span id="time-ampm" class="text-2xl md:text-4xl font-light">AM</span>
                    <span id="time-seconds" class="text-xl md:text-3xl font-light opacity-80">00</span>
                </div>
            </div>
            <div id="date-display" class="mt-4 text-xl md:text-2xl font-light tracking-widest uppercase opacity-90">
                LOADING...
            </div>
        </div>

        <!-- Hidden / Embedder Container (Revealed when AM/PM is clicked) -->
        <div id="embedder-view" class="hidden flex-grow p-4 rounded-lg overflow-auto hide-scrollbar max-w-2xl mx-auto mt-10 w-full z-10 bg-black/40 backdrop-blur-md border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h1 class="scroll-m-20 text-3xl font-extrabold tracking-tight">about:blank embedder</h1>
                <button id="back-to-clock" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1 rounded transition">Back to Clock</button>
            </div>
            <div class="mt-6">
                <input id="url-target" type="url" placeholder="Enter URL here..." class="flex h-10 w-full rounded-md border border-input bg-white px-3 py-2 text-sm text-black ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
                
                <div class="flex py-2 mt-2">
                    <button id="create-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-zinc-700 text-white hover:bg-zinc-600 h-10 px-4 py-2 mr-2 transition">Create Page</button>
                    <button id="clear-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-zinc-800 text-white hover:bg-zinc-700 h-10 px-4 py-2 transition">Clear Input</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Floating Control Panel (Right Side Sidebar matching requested layout) -->
    <div class="absolute right-5 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-50 bg-black/40 backdrop-blur-md p-2 rounded-xl border border-white/10 shadow-lg">
        <!-- 1. Heart Button -->
        <button id="btn-heart" title="Favorite" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white">
            <svg id="heart-icon" class="w-5 h-5 transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
        </button>

        <!-- 2. Fullscreen Button -->
        <button id="btn-fullscreen" title="Toggle Fullscreen" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg>
        </button>

        <!-- 3. Minimize / Maximize Hybrid View Button -->
        <button id="btn-maximize" title="Compact / Expand View" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M15 15v4.5m0-4.5h4.5m0 4.5l-5.25-5.25"/></svg>
        </button>

        <!-- 4. Settings / Options Button -->
        <button id="btn-settings" title="Settings & Themes" class="w-10 h-10 flex items-center justify-center bg-zinc-800/80 hover:bg-zinc-700 rounded-lg transition text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
    </div>

    <!-- Settings & Customization Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-2xl w-80 shadow-2xl flex flex-col gap-4 text-white">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-lg">Preferences & Themes</h3>
                <button id="close-modal" class="text-zinc-400 hover:text-white font-bold">&times;</button>
            </div>
            
            <div class="flex flex-col gap-3 text-sm">
                <label class="font-semibold text-zinc-400">Theme Selection</label>
                <select id="theme-select" class="bg-zinc-800 border border-zinc-700 rounded p-2 text-white">
                    <option value="theme-carbon">Carbon Texture</option>
                    <option value="theme-dark">Solid Dark</option>
                    <option value="theme-light">Light Mode</option>
                    <option value="theme-blue">Midnight Blue</option>
                </select>

                <hr class="border-zinc-800 my-1">
                <label class="font-semibold text-zinc-400">Clock Display Options</label>
                
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-12hr" checked class="rounded bg-zinc-800 border-zinc-700"> 12-Hour Format</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-ampm" checked class="rounded bg-zinc-800 border-zinc-700"> Show AM/PM</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-seconds" checked class="rounded bg-zinc-800 border-zinc-700"> Show Seconds</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-date" checked class="rounded bg-zinc-800 border-zinc-700"> Show Date</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-week" checked class="rounded bg-zinc-800 border-zinc-700"> Show Week / Day</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opt-tabseconds" class="rounded bg-zinc-800 border-zinc-700"> Tab Title Seconds</label>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        // Toast Helper
        function showToast(title, description) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-white text-black px-4 py-3 rounded-md shadow-lg border border-gray-200 transition-all duration-300 transform translate-y-2 opacity-0 flex flex-col";
            toast.innerHTML = `<span class="font-bold text-sm">${title}</span><span class="text-xs text-gray-600">${description}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Clock & Option Elements
        const timeMainEl = document.getElementById('time-main');
        const timeAmpmEl = document.getElementById('time-ampm');
        const timeSecondsEl = document.getElementById('time-seconds');
        const dateDisplayEl = document.getElementById('date-display');
        
        const opt12hr = document.getElementById('opt-12hr');
        const optAmpm = document.getElementById('opt-ampm');
        const optSeconds = document.getElementById('opt-seconds');
        const optDate = document.getElementById('opt-date');
        const optWeek = document.getElementById('opt-week');
        const optTabSeconds = document.getElementById('opt-tabseconds');

        // Live Clock Engine
