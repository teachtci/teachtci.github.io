<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Home - TT</title>
        <link rel="icon" type="image/png" href="https://favicons.statusgator.com/UNZSryX8tg2s2hlE.png">
        <meta
            name="description"
            content="A flip-clock showing the current time and date — a monochrome widget you can embed in Notion or any oEmbed consumer."
        />

        <!-- oEmbed discovery -->
        <link
            rel="alternate"
            type="application/json+oembed"
            href="https://vzsoares.github.io/open-oembed-widgets/clock/oembed.json"
            title="Clock"
        />

        <link rel="stylesheet" href="/src/styles.css" />
        <!-- Include Tailwind CSS via CDN for the embedder view styling -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script type="module" src="/src/widgets/clock/index.ts"></script>

        <style>
            /* Condensed, web-safe display face */
            .clock-num {
                font-family:
                    Impact, "Haettenschweiler", "Franklin Gothic Bold",
                    "Arial Narrow Bold", sans-serif;
                line-height: 1;
                letter-spacing: 0.03em;
                animation: clock-flip 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            }

            @keyframes clock-flip {
                0% {
                    transform: translateY(-60%);
                    opacity: 0;
                }
                55% {
                    opacity: 1;
                }
                100% {
                    transform: translateY(0);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .clock-num {
                    animation: none;
                }
            }
        </style>
    </head>
    <body class="font-sans bg-gray-950 text-white h-screen flex flex-col">
        
        <!-- Main Clock View Wrapper -->
        <main
            id="clock-container"
            x-data="clockWidget"
            x-cloak
            class="flex min-h-screen w-full flex-col items-center justify-center gap-4 p-5"
        >
            <!-- Time (flip): one rounded tile per unit, separated by a colon -->
            <div
                x-show="showTime && config.style !== 'analog'"
                class="flex items-end gap-2"
            >
                <div class="flex items-center gap-2">
                    <template x-for="(t, i) in parts.tiles" :key="i">
                        <div class="flex items-center gap-2">
                            <span
                                x-show="i > 0"
                                class="text-4xl font-bold opacity-70"
                                aria-hidden="true"
                                >:</span
                            >
                            <div
                                class="overflow-hidden rounded-lg bg-white px-3 py-1.5 text-black shadow-lg"
                            >
                                <template x-for="v in [t]" :key="t">
                                    <span
                                        class="clock-num block text-6xl tabular-nums"
                                        x-text="v"
                                    ></span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                
                <!-- AM/PM label: clicking directly here triggers the embedder -->
                <span
                    id="am-pm-trigger"
                    x-show="parts.meridiem"
                    class="mb-1 font-mono text-xs uppercase tracking-widest cursor-pointer hover:text-blue-400 hover:scale-105 transition select-none bg-white/10 px-2.5 py-1 rounded shadow"
                    title="Click AM or PM to open Embedder"
                    x-text="parts.meridiem"
                ></span>
            </div>

            <!-- Caption: Weekday | Month D, YYYY -->
            <p
                x-show="showDate"
                class="text-[17px] font-bold tracking-tight"
                x-text="parts.caption"
            ></p>
        </main>

        <!-- Hidden Embedder View (Activated when AM/PM is pressed) -->
        <div id="embedder-view" class="hidden flex-grow p-6 rounded-2xl overflow-auto hide-scrollbar max-w-2xl mx-auto mt-10 w-full z-10">
            <div class="flex justify-between items-center mb-4">
                <h1 class="scroll-m-20 text-3xl font-extrabold tracking-tight">about:blank embedder</h1>
                <button id="back-to-clock" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition">Back to Clock</button>
            </div>
            <div class="mt-6">
                <input id="url-target" type="url" placeholder="Enter URL here..." class="flex h-10 w-full rounded-md border border-input bg-white px-3 py-2 text-sm text-black ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
                
                <div class="flex py-2 mt-2">
                    <button id="create-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-zinc-700 text-white hover:bg-zinc-600 h-10 px-4 py-2 mr-2 transition">Create Page</button>
                    <button id="clear-btn" class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-zinc-800 text-white hover:bg-zinc-700 h-10 px-4 py-2 transition">Clear Input</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

        <script>
            // Toast Helper
            function showToast(title, description) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = "bg-white text-black px-4 py-3 rounded-md shadow-lg border border-gray-200 transition-all duration-300 transform translate-y-2 opacity-0 flex flex-col";
                toast.innerHTML = `<span class="font-bold text-sm">${title}</span><span class="text-xs text-gray-600">${description}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // Click listener that catches clicks on the dynamic AM/PM text
            document.addEventListener('click', (e) => {
                const trigger = e.target.closest('#am-pm-trigger');
                if (trigger) {
                    document.getElementById('clock-container').classList.add('hidden');
                    document.getElementById('embedder-view').classList.remove('hidden');
                }
            });

            // Switch back to clock view
            document.getElementById('back-to-clock').addEventListener('click', () => {
                document.getElementById('embedder-view').classList.add('hidden');
                document.getElementById('clock-container').classList.remove('hidden');
            });

            // Embedder Functionality
            let lastClearedUrl = "";
            document.getElementById('create-btn').addEventListener('click', () => {
                let urlInput = document.getElementById("url-target");
                let url = urlInput.value.trim();
                
                if (!url) {
                    showToast("Error", "URL cannot be empty.");
                    return;
                }
                
                showToast("Page opened!", "The page has been opened in a new tab.");

                if (url.substring(0, 8) !== "https://" && url.substring(0, 7) !== "http://") {
                    url = "https://" + url;
                } else if (url.substring(0, 7) === "http://") {
                    url = "https://" + url.substring(7);
                }

                const win = window.open();
                if (win) {
                    win.document.body.style.margin = "0";
                    win.document.body.style.height = "100vh";
                    let frm = win.document.createElement("iframe");
                    frm.style.border = "none";
                    frm.style.width = "100%";
                    frm.style.height = "100%";
                    frm.style.margin = "0";
                    frm.referrerPolicy = "no-referrer";
                    frm.allow = "fullscreen";
                    frm.src = url;
                    win.document.body.appendChild(frm);
                }
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                let urlInput = document.getElementById("url-target");
                let url = urlInput.value;
                
                if (!url) {
                    showToast("Error", "Input is already empty.");
                    return;
                }

                lastClearedUrl = url;
                urlInput.value = "";
                showToast("Input cleared", "The input has been cleared.");
            });
        </script>
    </body>
</html>
